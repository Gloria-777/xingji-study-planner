<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="星迹 · 学习规划与心态助手 —— 导入课表与任务，看见空闲时间，安排可执行的小步骤。纯静态网页，数据只存在你自己的浏览器里。">
<meta name="theme-color" content="#08071a">
<title>星迹 · 学习规划与心态助手</title>
<!-- 首屏之前先把深浅色定下来：模块脚本是 deferred 的，等它跑起来再改属性，
     选过「浅色」的人会先看见一帧深色。这一小段和 js/theme.js 读的是同一个键、
     同一个判定，只多做一件事——把结果写在 <html> 上。改了 theme.js 就要改这里。 -->
<script>
(function () {
  try {
    var m = localStorage.getItem('xj-theme-mode');
    if (m !== 'dark' && m !== 'light' && m !== 'system') m = 'dark';
    if (m === 'system') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = m;
  } catch (e) { /* 读不到偏好就保持 <html> 上写好的深色 */ }
})();
</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-text">
        <b>星迹 · 学习规划与心态助手</b>
        <small>看见空闲时间，安排可执行的小步骤</small>
      </span>
    </div>
    <h1 class="appbar-title" id="appbar-title">今日</h1>
    <div class="topbar-right">
      <span class="chip" id="chip-reminder" title="网页提醒状态">提醒未开启</span>
      <span class="chip" id="chip-notify" title="浏览器通知权限">通知：未申请</span>
      <span class="chip" id="chip-data" title="本地数据条数">数据 0</span>
      <button type="button" class="btn btn-ghost" id="btn-sample">加载示例数据</button>
    </div>
    <!-- 手机端把三颗胶囊和示例数据收进这一颗按钮里，首屏先给内容 -->
    <button type="button" class="appbar-status" id="appbar-status" aria-label="本机状态">
      <span class="appbar-status-dot" aria-hidden="true"></span>
      <span id="appbar-status-text">状态</span>
    </button>
  </header>

  <nav class="side" id="nav" aria-label="主导航"></nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<noscript><p class="noscript">这个页面需要 JavaScript 才能运行，请在浏览器设置中允许脚本后重新打开。</p></noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
